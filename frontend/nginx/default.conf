# Exclude query strings from static access logs as a defense in depth measure.
log_format frontend_safe '$remote_addr - $remote_user [$time_local] '
                         '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                         '"$http_user_agent"';

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;
    server_tokens off;
    error_log /var/log/nginx/error.log crit;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    access_log /var/log/nginx/access.log frontend_safe;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # Vite fingerprints files below /assets; root public files are not immutable.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
