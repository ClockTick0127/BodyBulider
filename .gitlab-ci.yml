stages:
  - validate
  - test
  - deploy

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "master"'
    - when: never

variables:
  DEPLOY_PATH: "/srv/bodybuilder"

.build_runner:
  tags:
    - bodybuilder-build
  interruptible: true

validate:compose:
  stage: validate
  extends: .build_runner
  image: docker:27.5.1-cli@sha256:851f91d241214e7c6db86513b270d58776379aacc5eb9c4a87e5b47115e3065c
  variables:
    FRONTEND_IMAGE: bodybuilder/frontend:validation
    BACKEND_IMAGE: bodybuilder/backend:validation
    MYSQL_DATABASE: bodybuilder
    MYSQL_USER: bodybuilder
    MYSQL_PASSWORD: validation-only
    MYSQL_ROOT_PASSWORD: validation-only
    VALKEY_PASSWORD: validation-only
    CORS_ALLOWED_ORIGIN: http://example.invalid
  script:
    - docker compose --env-file .env.example -f deploy/compose.production.yaml config --quiet
    - docker compose --env-file deploy/dev.env.example -f deploy/compose.development.yaml config --quiet

validate:nginx:
  stage: validate
  extends: .build_runner
  image:
    name: nginx:1.30.4-alpine@sha256:97d490c12ba55b4946b01546d1c3ed324e8d41ab1c9fcb2a616aa470620e5b46
    entrypoint: [""]
  script:
    - apk add --no-cache openssl
    - mkdir -p /etc/letsencrypt/live/bodybuilder.kro.kr
    - >-
      openssl req -x509 -newkey rsa:2048 -nodes -days 1
      -subj "/CN=bodybuilder.kro.kr"
      -keyout /etc/letsencrypt/live/bodybuilder.kro.kr/privkey.pem
      -out /etc/letsencrypt/live/bodybuilder.kro.kr/fullchain.pem
      >/dev/null 2>&1
    - cp deploy/nginx/default.conf /etc/nginx/conf.d/default.conf
    - nginx -t
    - cp frontend/nginx/default.conf /etc/nginx/conf.d/default.conf
    - nginx -t

validate:shell:
  stage: validate
  extends: .build_runner
  image: bash:5.2-alpine3.21@sha256:64defcbc5126c2d81122b4fb78a629a6d27068f0842c4a8302b8273415b12e30
  script:
    - bash -n deploy/scripts/deploy.sh

test:frontend:
  stage: test
  extends: .build_runner
  image: node:22-alpine@sha256:16e22a550f3863206a3f701448c45f7912c6896a62de43add43bb9c86130c3e2
  variables:
    NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - .npm/
  script:
    - cd frontend
    - npm ci --prefer-offline
    - npm run lint
    - npm run build

test:backend:
  stage: test
  extends: .build_runner
  image: eclipse-temurin:21-jdk-alpine@sha256:1ff763083f2993d57d0bf374ab10bb3e2cb873af6c13a04458ebbd3e0337dc76
  services:
    - name: valkey/valkey:8.1-alpine@sha256:a038175878d66b9d274fbf8be73c0305e93798b83917647f167e18cef3c71eec
      alias: valkey
  variables:
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-ci"
    SPRING_DATA_REDIS_HOST: valkey
    SPRING_DATA_REDIS_PORT: "6379"
  cache:
    key:
      files:
        - backend/gradle/wrapper/gradle-wrapper.properties
        - backend/build.gradle
    paths:
      - .gradle-ci/caches/
      - .gradle-ci/wrapper/
  script:
    - cd backend
    - sh ./gradlew --no-daemon clean test bootJar

deploy:production:
  stage: deploy
  tags:
    - bodybuilder-deploy
  resource_group: production
  environment:
    name: production
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master" && $CI_COMMIT_REF_PROTECTED == "true"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "master" && $CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
      allow_failure: false
  script:
    - |
      set -Eeuo pipefail

      deploy_frontend=false
      deploy_backend=false
      deploy_infrastructure=false

      if [[ "$CI_PIPELINE_SOURCE" == "web" ]] ||
         [[ -z "${CI_COMMIT_BEFORE_SHA:-}" ]] ||
         [[ "$CI_COMMIT_BEFORE_SHA" =~ ^0+$ ]] ||
         ! git cat-file -e "$CI_COMMIT_BEFORE_SHA^{commit}" 2>/dev/null; then
        echo "변경 기준 커밋을 확인할 수 없어 전체 배포합니다."
        deploy_frontend=true
        deploy_backend=true
        deploy_infrastructure=true
      else
        while IFS= read -r changed_path; do
          case "$changed_path" in
            frontend/*) deploy_frontend=true ;;
            backend/*) deploy_backend=true ;;
            deploy/*|.env.example) deploy_infrastructure=true ;;
          esac
        done < <(git diff --name-only "$CI_COMMIT_BEFORE_SHA" "$CI_COMMIT_SHA")
      fi

      if [[ "$deploy_infrastructure" == true ]]; then
        deploy_frontend=true
        deploy_backend=true
      fi

      if [[ "$deploy_frontend" == false && "$deploy_backend" == false ]]; then
        echo "배포 대상 변경이 없어 컨테이너 배포를 건너뜁니다."
        exit 0
      fi

      frontend_image=""
      backend_image=""

      if [[ "$deploy_frontend" == true ]]; then
        frontend_image="bodybuilder/frontend:$CI_COMMIT_SHA-$CI_PIPELINE_ID"
        docker build --pull \
          --build-arg VITE_API_BASE_URL= \
          --build-arg VITE_ENABLE_MSW=false \
          --build-arg VITE_GOOGLE_CLIENT_ID="${VITE_GOOGLE_CLIENT_ID:-}" \
          --build-arg VITE_KAKAO_REST_API_KEY="${VITE_KAKAO_REST_API_KEY:-}" \
          --tag "$frontend_image" \
          frontend
      fi

      if [[ "$deploy_backend" == true ]]; then
        backend_image="bodybuilder/backend:$CI_COMMIT_SHA-$CI_PIPELINE_ID"
        docker build --pull --tag "$backend_image" backend
      fi

      RECREATE_GATEWAY="$deploy_infrastructure" \
        bash deploy/scripts/deploy.sh "$frontend_image" "$backend_image"
