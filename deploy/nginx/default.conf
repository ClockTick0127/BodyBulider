# The container listens on unprivileged ports; Docker publishes 80 and 443.
map $server_port $forwarded_port {
    8080    80;
    8443    443;
    default $server_port;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Do not write query strings to the access log.
log_format gateway_safe '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                        '"$http_user_agent"';
access_log /var/log/nginx/access.log gateway_safe;

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name bodybuilder.kro.kr;
    server_tokens off;
    error_log /var/log/nginx/error.log crit;

    location = /gateway-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://bodybuilder.kro.kr$request_uri;
    }
}

server {
    listen 8443 ssl default_server;
    listen [::]:8443 ssl default_server;
    server_name bodybuilder.kro.kr;
    server_tokens off;
    error_log /var/log/nginx/error.log crit;

    ssl_certificate /etc/letsencrypt/live/bodybuilder.kro.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bodybuilder.kro.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /gateway-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /ws-stomp {
        set $backend_origin http://backend:8080;
        proxy_pass $backend_origin;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $forwarded_port;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /api/ {
        set $backend_origin http://backend:8080;
        proxy_pass $backend_origin;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $forwarded_port;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location / {
        set $frontend_origin http://frontend:8080;
        proxy_pass $frontend_origin;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $forwarded_port;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
