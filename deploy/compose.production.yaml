x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  gateway:
    image: nginxinc/nginx-unprivileged:1.30.4-alpine@sha256:44e36330f74d4f3a1d4e222acca9e23b401fb87811a7597024502bb759c4dd49
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:8080"
      - "${HTTPS_PORT:-443}:8443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/gateway-health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    read_only: true
    mem_limit: ${GATEWAY_MEMORY_LIMIT:-128m}
    pids_limit: 100
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - edge

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE must contain an explicit local image tag}
    restart: unless-stopped
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    read_only: true
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-128m}
    pids_limit: 100
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - edge

  backend:
    image: ${BACKEND_IMAGE:?BACKEND_IMAGE must contain an explicit local image tag}
    restart: unless-stopped
    init: true
    expose:
      - "8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:?MYSQL_DATABASE is required}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul"
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      VALKEY_HOST: valkey
      VALKEY_HOST_PORT: "6379"
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?VALKEY_PASSWORD is required}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:?CORS_ALLOWED_ORIGIN is required}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      TZ: ${TZ:-Asia/Seoul}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID:-}
      KAKAO_CLIENT_SECRET: ${KAKAO_CLIENT_SECRET:-}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI:-}
    depends_on:
      mysql:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
    read_only: true
    mem_limit: ${BACKEND_MEMORY_LIMIT:-768m}
    pids_limit: 256
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging
    networks:
      - edge
      - data

  mysql:
    image: mysql:8.4@sha256:c592c15aaf4a1961e15d82eb31ea5987dda862d1c4b1e93424438c0e91dc1f8d
    ports:
      - "127.0.0.1:3306:3306"
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      TZ: ${TZ:-Asia/Seoul}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql_data:/var/lib/mysql
    mem_limit: ${MYSQL_MEMORY_LIMIT:-1024m}
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=tcp -h 127.0.0.1 -u\"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - data
      - db_admin

  valkey:
    image: valkey/valkey:8.1-alpine@sha256:a038175878d66b9d274fbf8be73c0305e93798b83917647f167e18cef3c71eec
    restart: unless-stopped
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?VALKEY_PASSWORD is required}
      TZ: ${TZ:-Asia/Seoul}
    command:
      - /bin/sh
      - -ec
      - exec valkey-server --appendonly yes --appendfsync everysec --requirepass "$$VALKEY_PASSWORD"
    volumes:
      - valkey_data:/data
    mem_limit: ${VALKEY_MEMORY_LIMIT:-256m}
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$VALKEY_PASSWORD\" ping 2>/dev/null | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    logging: *default-logging
    networks:
      - data

networks:
  edge:
    driver: bridge
  data:
    driver: bridge
    internal: true
  db_admin:
    driver: bridge

volumes:
  mysql_data:
  valkey_data:
